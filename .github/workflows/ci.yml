name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Also verify main AFTER a merge. Without this, CI only ever saw proposed
  # changes, so a broken main stayed invisible until some later PR inherited the
  # break and failed for reasons that had nothing to do with it. That is exactly
  # what happened on 2026-07-29: #269 merged with all three build jobs red, and
  # main was unbuildable for about a day while every subsequent PR failed at the
  # first cargo step.
  #
  # This matters more, not less, with Renovate automerging non-major bumps: those
  # land without a human looking, so the post-merge check is what turns "main is
  # broken" from a discovery into a notification.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `changes` reads the PR's file list to decide whether the Rust jobs have
  # anything to inspect.
  pull-requests: read

jobs:
  # Renovate automerges devbox digest/pin/patch/minor bumps (renovate.json), and
  # those PRs touch nothing but devbox.json / devbox.lock. No Rust job can
  # observe such a change — every one of them installs its toolchain directly via
  # dtolnay/rust-toolchain and taiki-e/install-action, never through devbox — so
  # they burn ~4 minutes across three runners to re-prove a tree that did not
  # move. This gate skips them for that one case and leaves the `devbox` job,
  # which is the only check that can actually see the diff.
  #
  # Same reasoning as the path filter on aarch64-crossbuild-check.yml: run the
  # expensive leg exactly when the thing it guards changed.
  #
  # The `flake.nix` / `flake.lock` pair gets the mirror-image treatment, and for
  # the mirror-image reason: no Rust job installs its toolchain through Nix
  # either, so a lock refresh cannot move what they compile. The `nix` job is the
  # one check that can see it, so that one keeps running while the Rust matrix
  # sits out. This is not hypothetical traffic: renovate.json turns
  # lockFileMaintenance on globally, and Renovate's `nix` manager refreshes
  # `flake.lock` on that schedule, so it is a weekly PR.
  #
  # Scoped to Renovate on purpose. A HUMAN PR touching only devbox files still
  # gets the full matrix — the cost is trivial at that frequency, and the author
  # may well be mid-way through a change that grows beyond devbox on the next
  # push.
  changes:
    runs-on: ubuntu-latest
    outputs:
      devbox_only: ${{ steps.detect.outputs.devbox_only }}
      flake_only: ${{ steps.detect.outputs.flake_only }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Anything that is not a Renovate PR gets the full matrix. On `push` to
          # main and on workflow_dispatch there is no pull_request payload, so
          # PR_AUTHOR is empty and we exit here — which is what keeps the
          # post-merge verification described above intact. That matters most for
          # exactly these PRs: they land unreviewed, so the push-to-main run is
          # the first time the Rust jobs ever see the merged result.
          if [ "${PR_AUTHOR:-}" != "renovate[bot]" ]; then
            echo "author='${PR_AUTHOR:-}' is not Renovate -> full CI"
            echo "devbox_only=false" >> "$GITHUB_OUTPUT"
            echo "flake_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `|| true` so a transient API failure falls into the fail-safe below
          # rather than aborting under `set -e`. A failed `changes` job would
          # skip every Rust job via `needs`, which is the one outcome worth
          # engineering against here.
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' || true)
          echo "changed files:"
          echo "$files"

          # Fail safe: an empty list means the API told us nothing useful. Run
          # everything rather than read that as "nothing to test".
          if [ -z "$files" ]; then
            echo "no files reported -> full CI"
            echo "devbox_only=false" >> "$GITHUB_OUTPUT"
            echo "flake_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both flags start true and any file outside their family clears them,
          # so a PR touching devbox.lock AND flake.lock clears both and gets the
          # full matrix. Deliberate: the two reductions rest on different jobs
          # surviving, and nothing here has looked at whether they interact.
          devbox_only=true
          flake_only=true
          while IFS= read -r f; do
            case "$f" in
              devbox.json | devbox.lock) flake_only=false ;;
              flake.nix | flake.lock) devbox_only=false ;;
              *)
                echo "'$f' is outside devbox and outside the flake -> full CI"
                devbox_only=false
                flake_only=false
                break
                ;;
            esac
          done <<< "$files"

          if [ "$devbox_only" = true ]; then
            echo "devbox files only -> skipping the Rust jobs and the nix job"
          elif [ "$flake_only" = true ]; then
            echo "flake files only -> skipping the Rust jobs, keeping nix"
          fi
          echo "devbox_only=$devbox_only" >> "$GITHUB_OUTPUT"
          echo "flake_only=$flake_only" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true' && needs.changes.outputs.flake_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2 # v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - run: cargo fmt --check
      # Issue #407 — `--all-targets --features e2e`, not the bare `cargo clippy`
      # this used to be. Both flags are load-bearing: without `--all-targets`
      # cargo builds only lib and bin targets, and every `tests/e2e_*.rs` opens
      # with `#![cfg(feature = "e2e")]`, so without the feature they compile to
      # empty crates. The old invocation therefore type-checked NO test file at
      # all — verified by injecting an E0308 into tests/e2e_handshake.rs, which
      # both `cargo clippy` and `cargo clippy --all-targets` reported clean.
      #
      # Until this step existed, e2e code was linted by nothing anywhere and
      # type-checked only by `cargo test-e2e` — which is not in CI (rule 5: it
      # spawns binaries and hits LLM APIs). This step is a type-check and lint
      # only; it runs no test and needs no agent or API key, so it does not
      # smuggle the e2e tier into CI. It just makes the local rule 2 gate
      # something a contributor cannot forget to run.
      #
      # Linux only. build-windows/build-macos below stay on bare `cargo clippy`
      # for the reason documented there, reinforced here: the L2 tier is
      # Unix-only in practice, so `--features e2e` against the Windows target
      # yields dozens of E0425s (scripts/windows-cross-check.sh, issue #164).
      #
      # `--workspace` (issue #436): cargo's default target selection is the
      # root package ALONE, so `xtask/docs`, `xtask/linkage-check` and
      # `xtask/spec` were linted by no gate anywhere. `xtask/spec` and
      # `xtask-docs` are path dev-deps so they were at least built, but
      # building is not linting and `xtask/linkage-check` was not even built.
      # A live `unnecessary_sort_by` had been sitting in its `clean_tmp.rs`
      # unnoticed; it is fixed in the same commit that added this flag, so the
      # widened gate landed green rather than red on its first run.
      - run: cargo clippy --workspace --all-targets --features e2e -- -D warnings
      - run: cargo build --release
      # `cargo nextest run`, NOT `cargo test` — the same runner as the
      # `cargo test-fast` local gate, and as build-macos/build-windows which
      # already use it. `cargo test` runs the whole tier in ONE process with
      # parallel threads; nextest gives each test its own process.
      #
      # That difference produced real flakes. On 2026-07-30, two different
      # timing-sensitive tests failed here and nowhere else:
      # `delegate_injects_single_line_pointer_and_keeps_footer_in_task_file`
      # (waiting on a PTY write; task file came back empty) and
      # `login_shell::tests::captures_path_despite_large_stdout_banner`
      # (subprocess plus a large stdout drain). Both passed on re-run with no
      # code change, both passed on macOS and Windows in the SAME runs, and
      # `cargo nextest run` passed 1343/1343 locally throughout — the three jobs
      # were a natural experiment and only the `cargo test` one flaked.
      #
      # Aligning the runners also makes a CI failure reproducible locally, which
      # neither of those was, and makes "green locally" mean the same thing as
      # "green in CI".
      #
      # `--workspace` (issue #489, duplicate #470) — the test-side sibling of
      # the same flag on the clippy step above, and it must stay in lockstep
      # with the `test-fast` alias in .cargo/config.toml for the "green locally
      # == green in CI" claim in the previous paragraph to hold. Cargo's
      # default selection is the root package alone, so the tests in
      # `xtask/linkage-check` and `xtask/docs` ran in NO gate anywhere: 1657
      # tests without the flag, 1705 with it. Clippy's `--workspace` still
      # BUILT those tests, which is why only their runtime assertions were
      # inert and the gap survived #436. Costs nothing measurable: all 48 are
      # under 40ms and the tier's wall clock is set by its slowest test.
      - run: cargo nextest run --workspace
      # CLAUDE.md rule 7 has always SAID this runs in CI ("CI's linkage-check
      # rule 7 fails the build if the Scenario comment is missing or the
      # generator fails"), and the build-macos/build-windows comment says these
      # steps "stay on the Linux job" — but no such step existed, so nothing
      # enforced either claim. Added 2026-07-30 after a revert removed two
      # `#[spec]`-annotated tests and left their tests/CATALOG.md entries
      # orphaned: linkage-check was failing on main and no gate noticed, because
      # it only ever ran when somebody invoked it by hand.
      - run: cargo xtask linkage-check

  # Issue #368 — run the LOCAL Windows pre-PR gate in CI, for one reason only:
  # so that it cannot rot again. `scripts/windows-cross-check.sh` had been
  # failing on every branch, bare `main` included, ever since #269 moved rustls
  # onto its `aws-lc-rs` provider, whose build script compiles ~600 C files that
  # a Linux host cannot cross-compile. Nothing noticed for months, because
  # nothing in CI ran the script — `build-windows` compiles natively and never
  # invokes it.
  #
  # This is NOT a second Windows code gate. `build-windows` below owns that and
  # does it properly (real build + clippy + tests on a real Windows runner).
  # This job answers a different question: *does the script itself still work?*
  # A dependency bump can pull in another native library and break it without
  # breaking anything else, and the breakage is then seen only by whoever next
  # runs /verify-pr — who pays for a fresh diagnosis and learns to ignore the
  # step. Exactly the reasoning behind the `cargo xtask linkage-check` step
  # above, which was added after linkage-check sat red on main unnoticed because
  # it only ever ran when somebody invoked it by hand.
  #
  # Cheap: it runs in parallel, and the critical path is build-macos, so it adds
  # ~0 wall-clock. It needs neither an MSVC toolchain (the script shims cc and
  # lib.exe, and `cargo check` never links) nor devbox — the shims supply the
  # toolchain rather than merely overriding devbox's CC/AR exports, so a bare
  # runner with CC and AR unset is enough (verified).
  windows-cross-check:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true' && needs.changes.outputs.flake_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Type-check the workspace for Windows from Linux
        run: |
          set -euo pipefail
          # Resolve the toolchain directory instead of trusting the script's
          # local-machine default: the directory is named for the pinned
          # toolchain (`1.97.1-x86_64-unknown-linux-gnu`), not `stable-*`, and it
          # changes on every version bump — so read it from rustup rather than
          # hardcoding either spelling.
          WINDOWS_CROSS_CHECK_TOOLCHAIN="$(rustup show home)/toolchains/$(rustup show active-toolchain | cut -d' ' -f1)"
          export WINDOWS_CROSS_CHECK_TOOLCHAIN
          echo "toolchain: $WINDOWS_CROSS_CHECK_TOOLCHAIN"
          scripts/windows-cross-check.sh

  # PRD #42 M8 — native Windows (x86_64-pc-windows-msvc) compile + clippy +
  # unit-test gate, running parallel to the Linux `build` job so a Windows-only
  # break is visible independently. Uses rustup via dtolnay/rust-toolchain (the
  # devbox/nix toolchain used locally is Linux-only) and the runner's native
  # MSVC toolchain — no cross-compile cc/lib.exe→ar shims (those are Linux-only
  # cross-check artifacts; windows-latest compiles and archives natively).
  #
  # SCOPE: foundation gate only, and the two exclusions have DIFFERENT
  # mechanisms:
  #   * the Unix-domain-socket daemon/attach/hook integration suites are gated
  #     to Unix at the source level (#![cfg(unix)]), so they compile to empty
  #     crates here;
  #   * the L2 PTY e2e suite is excluded because this job runs `cargo nextest
  #     run` WITHOUT `--features e2e` — all but two `tests/e2e_*.rs` files open
  #     with a bare `#![cfg(feature = "e2e")]` and carry no Unix gate at all, so
  #     they are never compiled here rather than compiled-and-emptied.
  # That second point is why `scripts/windows-cross-check.sh --features e2e` is
  # red locally and is not a gate (issue #368). Porting the harness to Windows
  # named pipes + ConPTY and running full integration/e2e on a Windows VM is
  # tracked by #164 (M10). aarch64-pc-windows-msvc is #164 (M9), not M8.
  build-windows:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true' && needs.changes.outputs.flake_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - run: cargo build
      # Match the Linux `build` job's clippy invocation (no --all-targets) so a
      # test-only lint can't fail Windows-only and be unreproducible on the
      # Linux pre-push gate (PRD #42 review S1).
      - run: cargo clippy -- -D warnings
      # test-fast tier only (CLAUDE.md #5): protocol/state + L1 render tests.
      # No `e2e` feature (needs real agents + LLM APIs) and no linkage-check /
      # `cargo xtask docs` steps — those stay on the Linux job.
      #
      # `--workspace` (issue #489) — and note this does NOT mirror the clippy
      # step above, which deliberately stays bare. That divergence is caused by
      # `--all-targets --features e2e`, whose Unix-only L2 tier yields dozens of
      # E0425s against the Windows target; `--workspace` is not part of it and
      # has no such mechanism. The flag is here because `test-fast` in
      # .cargo/config.toml carries it on EVERY platform: a Windows contributor
      # typing `cargo test-fast` now runs the xtask tests, so this job has to
      # run them too or a Windows-only break in them is invisible on PRs and
      # surfaces only on that contributor's machine — the exact failure mode
      # this job exists to prevent. The one xtask test with a platform
      # dependency (`symlinks_named_like_owned_dirs_are_skipped`) is already
      # `#[cfg(unix)]`; the rest are in-memory or tempdir-based.
      - run: cargo nextest run --workspace

  # macOS (host = aarch64-apple-darwin) compile + clippy + unit-test gate,
  # mirroring build-windows. macOS is otherwise built ONLY in the release
  # workflow (release.yml builds both apple targets), so a macOS-only break —
  # e.g. the libc *mut/*const `openpty` and `ioctl` request-type differences in
  # src/wrap.rs — stayed invisible on PRs and first surfaced at release time
  # (broke the v0.34.0 build). This job closes that gap. The runner is Apple
  # Silicon, so this covers aarch64-apple-darwin exactly; x86_64-apple-darwin
  # shares the same libc apple bindings, so a host build catches the same class.
  #
  # Unlike build-windows (where the unix daemon/attach/e2e suites are gated to
  # Unix at the source level and compile to empty crates), macOS *is* unix, so
  # `cargo nextest run` runs the same test-fast tier as the Linux `build` job.
  build-macos:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true' && needs.changes.outputs.flake_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - run: cargo build
      # Match the Linux `build` job's clippy invocation (no --all-targets) so a
      # test-only lint can't fail macOS-only and be unreproducible on the Linux
      # pre-push gate.
      - run: cargo clippy -- -D warnings
      # `--workspace` (issue #489), for the reason spelled out on the
      # build-windows step: the `test-fast` alias carries the flag on every
      # platform, so this job must run the xtask tests to keep "green locally"
      # and "green in CI" the same claim on macOS. Unlike the clippy step above
      # there is nothing to match-and-narrow here — the clippy divergence is
      # about `--all-targets --features e2e`, not about package selection.
      - run: cargo nextest run --workspace

  # Fork-only. Runs the L2 PTY/e2e tier (CLAUDE.md rule 5) in CI so it no
  # longer has to run on a contributor's own machine, competing with
  # everything else they have open — the L2 suite spawns real dot-agent-deck
  # binaries and PTYs, and running it locally alongside a rebuild/rebase/test
  # cycle repeatedly starved the local machine (load average 20+, memory
  # pressure) during PRD #373's own review. Moving it to a CI runner's
  # dedicated resources sidesteps that entirely.
  #
  # DELIBERATELY INFORMATIONAL, NOT A REQUIRED GATE: `continue-on-error:
  # true` so a red run never blocks a PR. CLAUDE.md rule 5 already documents
  # this tier as flaky-tolerant (timing-sensitive PTY/real-process
  # assertions), and this repo's own release pipeline broke once already
  # (2026-08-04) from a required check it could not itself satisfy — making
  # e2e required would risk the same failure mode for a tier that is
  # expected to be noisier than the fast tier, not less. Treat a red run
  # here as a signal worth reading, not a merge blocker.
  #
  # NO API KEYS CONFIGURED: 19 of the 66 `tests/e2e_*.rs` files (25 test
  # functions) spend real LLM tokens against a live agent CLI + credentials;
  # every one of them self-skips at runtime (Decision 26, `skip_unless!(...)`
  # on `check_claude_available()` / `check_codex_available()` /
  # `check_opencode_available()` / `check_pi_available()`'s
  # `OPENROUTER_API_KEY`) rather than failing when the CLI or key is absent.
  # Regenerate the list with `grep -rln 'skip_unless' tests/e2e_*.rs` rather
  # than trusting this comment. The other 47 files drive the real spawned
  # binary over a PTY against synthetic `cat`/scripted stub agents — no
  # network, no spend, no secrets — and run for real here. Wiring real
  # credentials (an `ANTHROPIC_API_KEY`/`OPENROUTER_API_KEY` secret, and
  # installing the `claude`/`codex`/`pi` CLIs) to also cover those 19 is a
  # separate follow-up with its own cost/security tradeoffs, not bundled in.
  #
  # Corrected 2026-08-07 (fork issue #26), counted on `main` at `4f872c5`:
  # this comment previously said "only 4 of the 64", naming `e2e_pi_live`,
  # `e2e_issue_dispatch_real`, `e2e_issue_dispatch_live` and
  # `e2e_scheduler_live_surface`. Two of those four carry no credential gate
  # at all (`e2e_issue_dispatch_live` and `e2e_scheduler_live_surface` drive
  # `cat` and DO run here), and 17 gated files were missing. CLAUDE.md rule
  # 5's carve-out (a) carried the same wrong number and is corrected with it.
  #
  # ubuntu-latest, matching `build` (not build-macos/build-windows): the
  # Unix-domain-socket daemon/attach/hook suites this tier depends on are
  # gated to Unix at the source level, same reasoning as `build-windows`'s
  # comment above.
  e2e:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Issue #33: this job was failing on most runs, with a DIFFERENT random
      # subset of tests each time — including on a PR that changed only prose.
      # The failures are all the L2 harness's fixed wall-clock deadlines firing
      # ("did not see ... within 10s") while four PTY tests, each of them several
      # processes, compete for a 4-vCPU runner. `.config/nextest.toml` now caps
      # concurrent PTY tests at 2, which reduces how often that happens;
      # `--retries 2` absorbs what is left.
      #
      # `--retries` is set HERE, on this one command, and deliberately NOT in
      # `.config/nextest.toml`: the fast tier (`test:` above) and every local run
      # keep the profile's `retries = 0`, so a flake there still fails loudly.
      #
      # This does NOT hide regressions. A test that fails for a real reason fails
      # all three attempts and the job stays red with a normal `FAIL`. A test that
      # passes on retry is reported as FLAKY, not as a plain pass: the log keeps
      # its `TRY 1 FAIL` line, the `Summary` line counts it, and the step below
      # lifts the names onto the run page so nobody has to open the log to see
      # them. A test that shows up in that table run after run is a test that is
      # always retrying — treat it as broken and file it.
      - run: cargo nextest run --features e2e --retries 2
      # `if: always()` because the step above exits non-zero on a real failure and
      # that is exactly when this summary is worth having. (Job-level
      # `continue-on-error` keeps the WORKFLOW green; it does not keep later steps
      # running.)
      - name: Publish flaky and failed e2e tests to the run summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          REPORT = "target/nextest/default/junit.xml"
          print("## e2e tier (informational)\n")
          if not os.path.exists(REPORT):
              print(f"No JUnit report at `{REPORT}` — the run never got as far as "
                    "executing tests. Read the step log.")
              raise SystemExit(0)

          root = ET.parse(REPORT).getroot()
          flaky, failed = [], []
          for suite in root.iter("testsuite"):
              for case in suite.iter("testcase"):
                  name = f'{suite.get("name")}::{case.get("name")}'
                  hard = case.findall("failure") + case.findall("error")
                  reruns = case.findall("flakyFailure") + case.findall("flakyError")
                  retried = case.findall("rerunFailure") + case.findall("rerunError")
                  if hard:
                      failed.append((name, 1 + len(retried)))
                  elif reruns:
                      flaky.append((name, 1 + len(reruns)))

          if failed:
              print("### Failed on every attempt\n")
              print("These are not contention. Read them.\n")
              print("| test | attempts |\n| --- | --- |")
              for name, attempts in sorted(failed):
                  print(f"| `{name}` | {attempts} |")
              print()
          if flaky:
              print("### Passed only on retry\n")
              print("Contention, most likely. A name that appears here run after "
                    "run is not a blip — file it.\n")
              print("| test | attempts |\n| --- | --- |")
              for name, attempts in sorted(flaky):
                  print(f"| `{name}` | {attempts} |")
              print()
          if not failed and not flaky:
              print("Every test passed on its first attempt.")
          PY

  # `cargo audit` reads Cargo.lock, which a devbox-only PR cannot touch.
  security:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true' && needs.changes.outputs.flake_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # PRD #231 M2: the only check that exercises the root flake.nix. Nothing else
  # in CI evaluates or builds it: the Rust jobs install their toolchain via
  # dtolnay/rust-toolchain, and the `devbox` job below resolves devbox.json,
  # which is a different flake for a different purpose. Without this job a
  # nixpkgs bump that breaks the derivation, or a Cargo.lock change that crane
  # cannot vendor, is discovered by the first user who types
  # `nix run github:vfarcic/dot-agent-deck`, the exact install path #231 asked
  # for.
  #
  # `nix flake check` and not `nix build`: it evaluates every output (packages,
  # apps, devShells, overlays), so a typo in an output nobody builds still fails
  # here, and `checks.default` is the package itself, so the check compiles
  # rather than merely evaluating. `-L` streams full build logs, which is the
  # difference between a diagnosable rustc error and "builder failed".
  #
  # `--all-systems` because a bare `nix flake check` silently narrows to the
  # runner's own system and prints "the check omitted these incompatible
  # systems: aarch64-darwin, aarch64-linux". Three quarters of the outputs would
  # then never be looked at from this x86_64-linux runner, which is exactly the
  # "typo in an output nobody builds" case above. It only *evaluates* the
  # foreign-system outputs and still builds nothing but the native one, so it
  # costs seconds. It earned its keep immediately: it is what caught that
  # `eachDefaultSystem` was promising an x86_64-darwin output the pinned nixpkgs
  # throws on.
  #
  # Gated on `devbox_only` only, NOT on `flake_only`: a Renovate PR touching only
  # devbox.json cannot change what this builds, so it sits that one out like the
  # Rust jobs do, but a `flake.lock` refresh is precisely what it exists to
  # verify, so it is the job that stays when the Rust matrix steps aside. Worth
  # gating at all because this is one of the heaviest jobs in the file: a
  # from-source release build of the whole crate.
  nix:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Determinate installer rather than cachix/install-nix-action: it is
      # what the cache action below is built to pair with, and it turns on
      # flakes (`nix-command`, `flakes`) without a hand-written extra-conf.
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # `determinate` defaults to TRUE, which installs Determinate Nix (a
          # downstream distribution) and runs its FlakeHub login on every job.
          # Two problems, and the noisy one is not the important one. The noisy
          # one: without `id-token: write` that login cannot work, so it prints
          # "FlakeHub is disabled because the workflow is misconfigured" on a job
          # whose next comment explains at length that the permission is
          # withheld on purpose. The important one: it would prove the flake
          # builds on Determinate Nix, when the people this job protects are the
          # ones who type `nix run github:vfarcic/dot-agent-deck` on upstream
          # Nix. Off, the runner gets upstream Nix and the check answers the
          # question actually being asked.
          determinate: false
          # No telemetry ping from the installer. Same setting on the cache
          # action below, so the "no third-party service" claim there covers the
          # whole job rather than just the cache backend.
          diagnostic-endpoint: ""
      # Caching the Nix store is not optional here, for the same reason the
      # `devbox` job sets enable-cache: a cold run rebuilds every dependency
      # from source. This job's cold cost is worse than devbox's, since
      # checks.default is a full release build of the crate and its whole
      # dependency tree. Magic Nix Cache stores that in GitHub Actions' own
      # cache, so there is no third-party service and no secret, and forks and
      # PRs get the cache too.
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          # GitHub Actions cache only. Left at its default, this action
          # opportunistically reaches for FlakeHub Cache, which wants an OIDC
          # token: the job would then need `id-token: write`, a permission this
          # workflow deliberately does not grant (it declares only
          # `contents: read` and `pull-requests: read`), in order to use a hosted
          # service the project has no account with. Off, this is a plain, free,
          # self-contained store cache.
          use-flakehub: false
          # The other half of "no third-party service": the cache action pings a
          # diagnostic endpoint of its own by default.
          diagnostic-endpoint: ""
      - run: nix flake check -L --all-systems

  # Semgrep CE (open source) static analysis. Runs alongside cargo audit above
  # and alongside Greptile's PR review (CLAUDE.md rule 8) -- neither replaces the
  # other. `auto` is deliberately not used: it is broad, slower, and phones home
  # telemetry. These packs are scoped to where CE's coverage actually pays off on
  # this repo -- the GitHub Actions workflows themselves and secrets -- since
  # `cargo clippy -- -D warnings` (CLAUDE.md rule 2) already covers most of what
  # CE's thin Rust ruleset would add. `p/bash` was tried and dropped: it 404s --
  # the current Semgrep registry has no general bash/shell ruleset pack, only an
  # unrelated `reverse-shells` pack that happens to tag `bash` as a language.
  #
  # `--no-error` is a deliberate first-rollout choice: this run establishes a
  # baseline finding count. Findings still reach code scanning either way, so
  # nothing is lost by not blocking yet. Flipping this to blocking (dropping
  # `--no-error`) is a follow-up decision once the baseline is triaged.
  semgrep:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - run: |
          # `unsafe-usage` fires on every `unsafe {}` block. This is a systems
          # codebase doing openpty / process control / raw fd handling, so
          # `unsafe` is expected rather than a defect -- and the rule produced
          # 209 of the first run's 286 findings, drowning everything else.
          # Excluding it is a readability decision, not a claim that the
          # `unsafe` code is audited.
          semgrep scan \
            --config p/rust \
            --config p/github-actions \
            --config p/secrets \
            --exclude-rule rust.lang.security.unsafe-usage.unsafe-usage \
            --sarif --output semgrep.sarif \
            --no-error
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # SonarQube Cloud (free plan) analysis. Complements, does not replace, Semgrep
  # CE above -- Sonar covers bugs/maintainability/complexity with real Rust depth
  # (85 rules), Semgrep covers security patterns. Cloud rather than Community
  # Build: Community Build only analyzes the main branch (no PR analysis, per its
  # own GitHub Actions guide), while Cloud Free analyzes PRs too when they target
  # main -- every PR in this repo does. See docs/develop/sonarqube.md.
  #
  # Secret-gated rather than `if:`-gated at the job level: the `secrets` context
  # is not reliably available in a job-level `if:`, so SONAR_TOKEN is surfaced as
  # a job-level env var and the scan steps check that instead. This matters for
  # PRs opened from forks, which never receive repo secrets, and would otherwise
  # fail outright rather than skip.
  #
  # `fetch-depth: 0` (unlike every other job's checkout) because Sonar needs full
  # git history for blame and new-code detection.
  #
  # The clippy run here is a separate, non-blocking report import
  # (`sonar.rust.clippyReport.reportPaths`), not a duplicate of rule 2's gate --
  # deliberately no `-D warnings`, since a non-zero exit here would kill the job
  # over findings Sonar is about to read anyway.
  sonarqube:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip if SONAR_TOKEN is not set
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN not set - skipping SonarQube analysis"
      # The three third-party actions below are SHA-pinned, unlike the rest of the repo's tag-pinned actions, specifically to satisfy Sonar's `new_security_rating` quality gate (rule githubactions:S7637), which grades new code only; `actions/checkout` above is GitHub-owned and exempt.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        if: env.SONAR_TOKEN != ''
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.SONAR_TOKEN != ''
      - name: Generate clippy report for Sonar import
        if: env.SONAR_TOKEN != ''
        run: cargo clippy --message-format=json > clippy-report.json
      - uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # devbox.json / devbox.lock had NO CI coverage until this job. Every other job
  # installs its toolchain directly (dtolnay/rust-toolchain, taiki-e/install-action,
  # cargo install), so a Renovate devbox bump went green on all five checks
  # without a single one of them resolving the lock or running a pinned tool.
  # That is not a hypothetical gap: Renovate automerges devbox digest/pin/patch/
  # minor, so those bumps land unreviewed against checks structurally incapable
  # of seeing them. #338 (vals 0.44.5 -> 0.45.0, which carried an upstream
  # optional-provider build-tag refactor) was green on all five while nothing had
  # executed `vals` at all — and `vals` is what resolves every secret in
  # .env.vals.yaml for the devbox shell.
  #
  # STILL NOT the version source for the build jobs, but no longer because those
  # jobs float. Until 2026-08-06 every Rust job used dtolnay/rust-toolchain@stable
  # and taiki-e/install-action@nextest, deliberately, to answer "does this still
  # compile on CURRENT stable". That traded a reproducible gate for an
  # upstream-breakage signal: `cargo test-fast` in the devbox shell and the same
  # command in CI compiled with different toolchains, so "green locally" and
  # "green in CI" were not the same claim, and a lint introduced by a new stable
  # would fail here unreproducibly.
  #
  # Every job now pins its Rust toolchain and cargo-nextest explicitly, to the
  # same versions devbox.json pins, under the standing rule that versions are
  # specific — never `@stable` / `@latest` / `@nextest`. The literal versions are
  # deliberately NOT repeated in this comment: renovate.json's customManagers
  # match on `toolchain:` and `tool: cargo-nextest@` anywhere under
  # .github/workflows, so a version quoted in prose would be extracted as a
  # dependency of its own and drift into its own upgrade PR. Read the values off
  # the steps. The values are DUPLICATED across jobs rather than read from
  # devbox.json: build-windows
  # could not consume devbox anyway (Nix has no native Windows support, and that
  # job exists to exercise the MSVC toolchain), and routing the others through it
  # would split the mechanism across platforms for no gain.
  #
  # Duplication is kept honest by Renovate rather than by discipline: the
  # `customManagers` entries in renovate.json track both pinned values (Rust from
  # rust-lang/rust releases, nextest from the crates.io datasource) and open the
  # same upgrade PRs the devbox pins get, so the two sides move together instead
  # of drifting silently. The upstream-breakage signal that the old floating refs
  # provided now arrives as those PRs — visible and gated on CI, rather than
  # landing unannounced in the middle of an unrelated change.
  #
  # SCOPE: x86_64-linux only. The aarch64-darwin entries in devbox.lock stay
  # unvalidated; add a macos-latest leg if that gap starts to bite.
  devbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          # Caches the whole Nix store keyed on devbox.json. Worth it: the
          # `path:gcloud#google-cloud-sdk` flake pulls nixpkgs-unstable and
          # builds the SDK, which dominates a cold run.
          enable-cache: true
      # A FILE, not an inline `bash -c '…'`: devbox flattens its trailing args
      # into one string and re-parses them through a shell, so a quoted
      # multi-line argument is destroyed before bash sees it. That is what broke
      # the first version of this job on main (devbox 0.17.5, `invalid version
      # 'set'`). See the header of the script for the detail.
      - run: devbox run -- bash scripts/devbox-smoke.sh
