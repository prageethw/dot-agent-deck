name: E2E

# Fork issue #50 (item 1) — split out of ci.yml into its own workflow. The L2
# e2e job (`cargo nextest run --features e2e`) takes 9-12 minutes against
# ci.yml's ~3-4 for the fast tier, and `gh run view --log-failed` returns
# NOTHING while any job in the run is still in progress — so sharing one
# workflow meant a fast-tier RED result stayed unreadable through `--log-failed`
# for the whole extra 5-8 minutes e2e was still running. e2e is already
# `continue-on-error: true` (see the job comment below) and is not a merge
# gate, so moving it out loses no coverage and roughly halves the fast-tier
# feedback loop. Splitting also means an unrelated push no longer cancels a
# still-running e2e run via ci.yml's concurrency group (see the dedicated
# group below).
#
# This workflow is itself fork-only, same as the job it carries: e2e does not
# exist upstream. See docs/develop/fork-sync-workflow.md's stack table, which
# now attributes 08a9402/65e46b2's job to this file rather than to ci.yml.
#
# Triggers, runner, toolchain, caching and the `changes` gate are all copied
# from ci.yml so coverage does not change — see the `changes` job comment
# below for why it is a full duplicate rather than a shared job.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# A group of its OWN, deliberately not `ci-${{ github.ref }}`. Reusing ci.yml's
# group would make this workflow's runs cancel-in-progress against ci.yml's (and
# vice versa) via `cancel-in-progress: true` on both — which reproduces exactly
# the coupling this split exists to remove: an unrelated push cancelling a
# still-running e2e run. Separate groups mean the two workflows run independently.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `changes` reads the PR's file list to decide whether e2e has anything to
  # test. Same reasoning as ci.yml's `changes` job.
  pull-requests: read

jobs:
  # Duplicated from ci.yml verbatim rather than shared: a GitHub Actions job
  # output cannot cross a workflow-file boundary (`needs:` only resolves
  # within the same workflow run), so keeping e2e's Renovate/devbox-only skip
  # meant either this workflow carrying its own copy of the gate or e2e giving
  # up the skip and running unconditionally. Duplication was chosen: the skip
  # is exactly the case that matters most for e2e specifically, since e2e is
  # the single most expensive job in either workflow (9-12 minutes) and
  # Renovate's devbox-only bumps are frequent, automerged, and structurally
  # incapable of touching anything the L2 tier exercises. Losing that skip
  # here would burn the most expensive job in the whole CI surface on every
  # such bump. The two `changes` jobs can drift in isolation from each other
  # only if someone edits one and not the other — keep them identical.
  changes:
    runs-on: ubuntu-latest
    outputs:
      devbox_only: ${{ steps.detect.outputs.devbox_only }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Anything that is not a Renovate PR gets the full matrix. On `push` to
          # main and on workflow_dispatch there is no pull_request payload, so
          # PR_AUTHOR is empty and we exit here — which is what keeps the
          # post-merge verification described in ci.yml intact. That matters most
          # for exactly these PRs: they land unreviewed, so the push-to-main run is
          # the first time e2e ever sees the merged result.
          if [ "${PR_AUTHOR:-}" != "renovate[bot]" ]; then
            echo "author='${PR_AUTHOR:-}' is not Renovate -> full CI"
            echo "devbox_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `|| true` so a transient API failure falls into the fail-safe below
          # rather than aborting under `set -e`. A failed `changes` job would
          # skip e2e via `needs`, which is the one outcome worth engineering
          # against here.
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' || true)
          echo "changed files:"
          echo "$files"

          # Fail safe: an empty list means the API told us nothing useful. Run
          # everything rather than read that as "nothing to test".
          if [ -z "$files" ]; then
            echo "no files reported -> full CI"
            echo "devbox_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r f; do
            case "$f" in
              devbox.json | devbox.lock) ;;
              *)
                echo "'$f' is outside devbox -> full CI"
                echo "devbox_only=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$files"

          echo "devbox files only -> skipping e2e"
          echo "devbox_only=true" >> "$GITHUB_OUTPUT"

  # Fork-only. Runs the L2 PTY/e2e tier (CLAUDE.md rule 5) in CI so it no
  # longer has to run on a contributor's own machine, competing with
  # everything else they have open — the L2 suite spawns real dot-agent-deck
  # binaries and PTYs, and running it locally alongside a rebuild/rebase/test
  # cycle repeatedly starved the local machine (load average 20+, memory
  # pressure) during PRD #373's own review. Moving it to a CI runner's
  # dedicated resources sidesteps that entirely.
  #
  # DELIBERATELY INFORMATIONAL, NOT A REQUIRED GATE: `continue-on-error:
  # true` so a red run never blocks a PR. CLAUDE.md rule 5 already documents
  # this tier as flaky-tolerant (timing-sensitive PTY/real-process
  # assertions), and this repo's own release pipeline broke once already
  # (2026-08-04) from a required check it could not itself satisfy — making
  # e2e required would risk the same failure mode for a tier that is
  # expected to be noisier than the fast tier, not less. Treat a red run
  # here as a signal worth reading, not a merge blocker.
  #
  # NO API KEYS CONFIGURED: 19 of the 66 `tests/e2e_*.rs` files (25 test
  # functions) spend real LLM tokens against a live agent CLI + credentials;
  # every one of them self-skips at runtime (Decision 26, `skip_unless!(...)`
  # on `check_claude_available()` / `check_codex_available()` /
  # `check_opencode_available()` / `check_pi_available()`'s
  # `OPENROUTER_API_KEY`) rather than failing when the CLI or key is absent.
  # Regenerate the list with `grep -rln 'skip_unless' tests/e2e_*.rs` rather
  # than trusting this comment. The other 47 files drive the real spawned
  # binary over a PTY against synthetic `cat`/scripted stub agents — no
  # network, no spend, no secrets — and run for real here. Wiring real
  # credentials (an `ANTHROPIC_API_KEY`/`OPENROUTER_API_KEY` secret, and
  # installing the `claude`/`codex`/`pi` CLIs) to also cover those 19 is a
  # separate follow-up with its own cost/security tradeoffs, not bundled in.
  #
  # ubuntu-latest, matching ci.yml's `build`: the Unix-domain-socket
  # daemon/attach/hook suites this tier depends on are gated to Unix at the
  # source level, same reasoning as ci.yml's `build-windows` comment.
  #
  # FORK-ONLY NOTE (fork issue #32) — where a red e2e result is actually
  # visible, and where it is not. `continue-on-error: true` on THIS job only
  # ever changes the WORKFLOW RUN's rolled-up `conclusion` (the field behind
  # `gh run list/view --json conclusion`, and the run-level status GitHub
  # computes for `needs:`/branch-protection purposes) — that is what it is
  # documented to do, and it is by design, not a bug: there is no way to keep
  # this job non-blocking while also making the run-level conclusion reflect
  # its result. It does NOT touch this job's OWN check-run conclusion. Verified
  # directly against the GitHub API on a run where e2e hard-failed (PR #72, run
  # `31160646366`): `gh api repos/{owner}/{repo}/commits/{sha}/check-runs` and
  # `gh run view --json jobs` both report the `e2e` check-run/job's own
  # `conclusion` as `failure`, correctly, even though the run's `conclusion`
  # was `success`; `gh pr checks` also prints `e2e  fail` plainly. So a red e2e
  # run was never actually hidden from anything that reads job/check-level
  # status — it was hidden only from whoever reads the aggregate run
  # `conclusion` and stops there, which is what misled this orchestration
  # twice. Read job/check level, not run level.
  #
  # What genuinely WAS unreadable via tooling: the curated failed/flaky table
  # the step below builds from junit.xml only ever went to
  # `$GITHUB_STEP_SUMMARY`, and that file's contents are not exposed through
  # any API (`check-run.output.summary` is `null` for a step-summary write,
  # confirmed on the same PR #72 run) — the raw `cargo nextest` log was the
  # only machine-readable source for it. Fixed below by also writing the same
  # table to the step's stdout (the job log), which `gh run view --job <id>
  # --log` (or the checks API's log endpoint) can read.
  e2e:
    needs: changes
    if: needs.changes.outputs.devbox_only != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-nextest@0.9.140
      # Issue #33: this job was failing on most runs, with a DIFFERENT random
      # subset of tests each time — including on a PR that changed only prose.
      # The failures are all the L2 harness's fixed wall-clock deadlines firing
      # ("did not see ... within 10s") while four PTY tests, each of them several
      # processes, compete for a 4-vCPU runner. `.config/nextest.toml` now caps
      # concurrent PTY tests at 2, which reduces how often that happens;
      # `--retries 2` absorbs what is left.
      #
      # `--retries` is set HERE, on this one command, and deliberately NOT in
      # `.config/nextest.toml`: ci.yml's fast tier and every local run keep the
      # profile's `retries = 0`, so a flake there still fails loudly.
      #
      # This does NOT hide regressions. A test that fails for a real reason fails
      # all three attempts and the job stays red with a normal `FAIL`. A test that
      # passes on retry is reported as FLAKY, not as a plain pass: the log keeps
      # its `TRY 1 FAIL` line, the `Summary` line counts it, and the step below
      # lifts the names onto the run page so nobody has to open the log to see
      # them. A test that shows up in that table run after run is a test that is
      # always retrying — treat it as broken and file it.
      - run: cargo nextest run --features e2e --retries 2
      # `if: always()` because the step above exits non-zero on a real failure and
      # that is exactly when this summary is worth having. (Job-level
      # `continue-on-error` keeps the WORKFLOW conclusion green; it does not
      # keep later steps running, and it does not touch THIS job's own
      # check-run conclusion — see the fork-only note above the job.)
      - name: Publish flaky and failed e2e tests to the run summary
        if: always()
        run: |
          # `tee -a`, not `>>`: the summary file (`$GITHUB_STEP_SUMMARY`) is
          # not retrievable through the GitHub API (fork issue #32 — a
          # check-run's `output.summary` is `null` for a step-summary write),
          # so mirroring the same table to stdout puts it somewhere the job
          # log — and therefore `gh run view --job <id> --log` — can actually
          # read.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          REPORT = "target/nextest/default/junit.xml"
          print("## e2e tier (informational)\n")
          if not os.path.exists(REPORT):
              print(f"No JUnit report at `{REPORT}` — the run never got as far as "
                    "executing tests. Read the step log.")
              raise SystemExit(0)

          root = ET.parse(REPORT).getroot()
          flaky, failed = [], []
          for suite in root.iter("testsuite"):
              for case in suite.iter("testcase"):
                  name = f'{suite.get("name")}::{case.get("name")}'
                  hard = case.findall("failure") + case.findall("error")
                  reruns = case.findall("flakyFailure") + case.findall("flakyError")
                  retried = case.findall("rerunFailure") + case.findall("rerunError")
                  if hard:
                      failed.append((name, 1 + len(retried)))
                  elif reruns:
                      flaky.append((name, 1 + len(reruns)))

          if failed:
              print("### Failed on every attempt\n")
              print("These are not contention. Read them.\n")
              print("| test | attempts |\n| --- | --- |")
              for name, attempts in sorted(failed):
                  print(f"| `{name}` | {attempts} |")
              print()
          if flaky:
              print("### Passed only on retry\n")
              print("Contention, most likely. A name that appears here run after "
                    "run is not a blip — file it.\n")
              print("| test | attempts |\n| --- | --- |")
              for name, attempts in sorted(flaky):
                  print(f"| `{name}` | {attempts} |")
              print()
          if not failed and not flaky:
              print("Every test passed on its first attempt.")
          PY
