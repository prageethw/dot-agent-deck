name: Drift Check

# FORK-ONLY. `fork-only` does not exist upstream (`vfarcic/dot-agent-deck` has
# no such branch), so this workflow has no meaning there — same basis as
# `e2e.yml`, `issue-label-hygiene.yml` and the Semgrep/Sonar jobs in `ci.yml`.
# A future `git rebase upstream/main` should never carry this file upstream;
# if it ever does, drop it the same way those are excluded.
#
# WHY THIS EXISTS
#
# This fork runs a two-branch model (docs/develop/fork-sync-workflow.md):
# `fork-only` holds the fork's stack and is what rebases onto upstream; `main`
# is reset to `fork-only` after each sync. Between syncs, `main` legitimately
# drifts ahead as fork PRs merge into it — that part is normal. What is not
# normal is how far it gets before anyone notices: every sync so far has
# discovered the drift late rather than caught it early (7, then 184, then 30,
# then 61 uncurated commits). The doc's own "Keep it current" note says to
# re-curate whenever a PR merges, and that has not happened on its own — this
# is the gate that was missing, not a discipline problem to nag about harder.
#
# This job is deliberately NEVER required and NEVER blocks a PR — see
# `docs/develop/fork-sync-workflow.md` and CLAUDE.md rule 8's "empty gate"
# discussion. It runs on its own schedule/dispatch/push trigger, well away
# from any PR's check list, and only ever fails its OWN run when drift crosses
# the threshold below. Read a red run here as "go re-curate", not "something
# is broken".
on:
  schedule:
    # Daily is enough — drift accrues over days, not minutes. 03:00 UTC, clear
    # of stale.yml's 01:30 UTC run above.
    - cron: '0 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      threshold_override:
        description: >-
          Override the drift threshold for this run only (default: 10 — see
          the THRESHOLD comment in the job below). Use this to test the job's
          pass/fail behavior on demand without waiting for the schedule.
        required: false
        type: string
      fork_branch_override:
        description: >-
          Override the fork-only branch name for this run only (default:
          fork-only). Use this to exercise the "could not determine" path on
          demand, e.g. by pointing it at a branch that does not exist.
        required: false
        type: string

concurrency:
  group: drift-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required here, not cosmetic: a shallow default clone
      # only has history for the checked-out ref, and `git rev-list
      # origin/fork-only..origin/main` needs both branches' full history to
      # produce a meaningful count.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Measure main vs fork-only drift
        env:
          THRESHOLD_OVERRIDE: ${{ inputs.threshold_override }}
          FORK_BRANCH_OVERRIDE: ${{ inputs.fork_branch_override }}
        run: |
          set -uo pipefail

          THRESHOLD="${THRESHOLD_OVERRIDE:-}"
          if [ -z "$THRESHOLD" ]; then
            # Default 10. Chosen because it would have caught every drift
            # incident on record early instead of late:
            #   2026-08-05:   7 commits
            #   2026-08-07: 184 commits
            #   2026-08-08:  30 commits
            #   2026-08-12:  61 commits
            # Re-curating ~10 commits is routine; re-curating dozens is a
            # multi-hour job. Bump this one value if normal day-to-day drift
            # routinely trips it — that is the only edit tuning requires.
            THRESHOLD=10
          fi

          # A caller who passed an explicit threshold_override and got a
          # non-numeric value must not be silently redirected to the
          # default — that would misreport what was actually evaluated. And
          # because this step specifies no `shell:` override, it runs under
          # GitHub Actions' default for a Linux `run:` step, `bash -eo
          # pipefail {0}` — `-e` (errexit) is already active before this
          # script's own `set -uo pipefail` line even runs, which only adds
          # `-u` and cannot turn `-e` off. A failing `[ -gt ]` comparison
          # later would still not be fatal on its own, though: it is
          # evaluated as an `if` condition, and errexit never fires for a
          # command tested by `if`/`while`/`until`, `-e` or not. Validate up
          # front instead of relying on that.
          case "$THRESHOLD" in
            ''|*[!0-9]*)
              {
                echo "## Drift check: COULD NOT DETERMINE"
                echo ""
                echo "\`threshold_override\` is not a non-negative integer: \`$THRESHOLD\`"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::threshold_override is not a non-negative integer: $THRESHOLD — refusing to silently fall back to the default"
              exit 1
              ;;
          esac

          FORK_BRANCH="${FORK_BRANCH_OVERRIDE:-}"
          if [ -z "$FORK_BRANCH" ]; then
            FORK_BRANCH="fork-only"
          fi

          echo "Comparing origin/main against origin/$FORK_BRANCH (threshold: $THRESHOLD commits)"

          # "Could not determine" must never look like a pass — a job that
          # silently reports success when it could not measure is the same
          # empty-gate failure mode CLAUDE.md rule 8 documents for Sonar/
          # e2e/a CONFLICTING PR. A missing or unreachable fork-only branch
          # is exactly that case, not "zero drift".
          if ! git rev-parse --verify "origin/$FORK_BRANCH" >/dev/null 2>&1; then
            {
              echo "## Drift check: COULD NOT DETERMINE"
              echo ""
              echo "\`origin/$FORK_BRANCH\` does not exist or is unreachable from this checkout."
              echo "This is NOT the same as \"no drift\" — the branch may have been renamed,"
              echo "deleted, or the fetch may have failed. Investigate before trusting this"
              echo "job again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::could not resolve origin/$FORK_BRANCH — treating as could-not-determine, not a pass"
            exit 1
          fi

          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            {
              echo "## Drift check: COULD NOT DETERMINE"
              echo ""
              echo "\`origin/main\` does not exist or is unreachable from this checkout."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::could not resolve origin/main — treating as could-not-determine, not a pass"
            exit 1
          fi

          # Both directions must be measured: a "main..fork-only" count of 0
          # is NOT the same as "the branches agree" if fork-only holds
          # commits main lacks (e.g. a sync's final reset/push was missed).
          if ! MAIN_AHEAD=$(git rev-list --count "origin/$FORK_BRANCH..origin/main" 2>&1); then
            {
              echo "## Drift check: COULD NOT DETERMINE"
              echo ""
              echo "\`git rev-list\` failed measuring how far \`main\` is ahead of \`$FORK_BRANCH\`:"
              echo '```'
              echo "$MAIN_AHEAD"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::git rev-list failed measuring main-ahead drift — treating as could-not-determine, not a pass"
            exit 1
          fi

          if ! FORK_AHEAD=$(git rev-list --count "origin/main..origin/$FORK_BRANCH" 2>&1); then
            {
              echo "## Drift check: COULD NOT DETERMINE"
              echo ""
              echo "\`git rev-list\` failed measuring how far \`$FORK_BRANCH\` is ahead of \`main\`:"
              echo '```'
              echo "$FORK_AHEAD"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::git rev-list failed measuring fork-ahead drift — treating as could-not-determine, not a pass"
            exit 1
          fi

          OLDEST_ISO=""
          OLDEST_AGE_DAYS=""
          if [ "$MAIN_AHEAD" -gt 0 ]; then
            OLDEST_ISO=$(git log --format=%cI "origin/$FORK_BRANCH..origin/main" | tail -1)
            if [ -n "$OLDEST_ISO" ]; then
              OLDEST_EPOCH=$(date -d "$OLDEST_ISO" +%s)
              NOW_EPOCH=$(date +%s)
              OLDEST_AGE_DAYS=$(( (NOW_EPOCH - OLDEST_EPOCH) / 86400 ))
            fi
          fi

          {
            echo "## \`main\` vs \`$FORK_BRANCH\` drift"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| \`main\` ahead of \`$FORK_BRANCH\` | $MAIN_AHEAD |"
            echo "| \`$FORK_BRANCH\` ahead of \`main\` | $FORK_AHEAD |"
            echo "| Threshold | $THRESHOLD |"
            if [ -n "$OLDEST_AGE_DAYS" ]; then
              echo "| Oldest un-curated commit | $OLDEST_ISO ($OLDEST_AGE_DAYS days old) |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          echo "main is $MAIN_AHEAD commits ahead of $FORK_BRANCH; $FORK_BRANCH is $FORK_AHEAD commits ahead of main (threshold $THRESHOLD)"

          # fork-only holding commits main lacks means a sync's final
          # reset/push was missed. The threshold has no meaning in this
          # direction — it is calibrated for re-curation volume, not this —
          # so any non-zero count here fails regardless of threshold.
          if [ "$FORK_AHEAD" -gt 0 ]; then
            echo "**Action needed:** \`$FORK_BRANCH\` has $FORK_AHEAD commit(s) that \`main\` does not — the sync's final reset/push to \`main\` was likely missed. See \`docs/develop/fork-sync-workflow.md\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$FORK_BRANCH is $FORK_AHEAD commits ahead of main — the sync's final reset/push to main was likely missed"
            exit 1
          fi

          if [ "$MAIN_AHEAD" -gt "$THRESHOLD" ]; then
            echo "**Action needed:** re-curate the \`fork-only\` stack per \`docs/develop/fork-sync-workflow.md\`'s \"Keep it current\" note before this grows further." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::main is $MAIN_AHEAD commits ahead of $FORK_BRANCH (threshold $THRESHOLD) — re-curate per docs/develop/fork-sync-workflow.md"
            exit 1
          fi

          echo "Drift is within threshold — nothing to do."

  notify:
    needs: drift-check
    # A `workflow_dispatch` run's result reflects whatever `threshold_override`
    # (or `fork_branch_override`) the dispatcher chose, not real drift state —
    # that is the whole point of those inputs (see their descriptions above).
    # So a dispatch run must never touch the tracking issue: it can forge
    # both a false alert (threshold_override=0) and a false recovery
    # (threshold_override=100000) against real, unrelated drift. Only
    # `schedule` and `push` ever reach this job — those two triggers carry no
    # override and are the only trustworthy signal sources.
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File, update, or close the drift-check tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.drift-check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          MARKER_LABEL="drift-check-alert"
          STILL_RED_MARKER="<!-- drift-check-notify:latest-still-red -->"

          # A failed `gh issue list` must not be silently read as "no open
          # issue exists" — that risks filing a duplicate on top of one we
          # simply failed to see. Check its exit status explicitly, matching
          # the "could not determine must never look like a pass" principle
          # the drift-check job above already commits to.
          if ! EXISTING=$(gh issue list --repo "$REPO" --label "$MARKER_LABEL" --state open --json number --jq '.[0].number // empty'); then
            echo "::error::could not query existing $MARKER_LABEL issues — refusing to act on an unknown state"
            exit 1
          fi

          if [ "$RESULT" = "failure" ]; then
            if [ -z "$EXISTING" ]; then
              # Cause-neutral: `drift-check` fails on real drift, a missed
              # sync push, an unresolvable override, or plain infra trouble —
              # this issue must not assert a specific cause it hasn't
              # verified. The run itself is the source of truth for which.
              BODY=$(printf '%s\n\n%s\n\n%s\n%s' \
                "The scheduled/push \`drift-check\` workflow is failing. See the run for the specific cause (drift over threshold, could-not-determine, or an infra failure) and, if applicable, the exact measurement: $RUN_URL" \
                "This issue is filed and updated automatically by \`drift-check.yml\`'s \`notify\` job (fork issue #502) — it will be closed automatically once the check goes green again, so treat a close on this issue as a real recovery signal, not manual bookkeeping. Re-curate the \`fork-only\` stack per \`docs/develop/fork-sync-workflow.md\`'s \"Keep it current\" note if the cause is drift." \
                "$STILL_RED_MARKER" \
                "Most recent still-red run: $RUN_URL")
              gh issue create --repo "$REPO" \
                --title "Drift check is failing" \
                --label "$MARKER_LABEL" --label chore --label ci-cd --label priority-high --label size-low \
                --body "$BODY"
            else
              # Do NOT post a new comment on every red run — replayed against
              # this repo's real run history that produced ~68 comments in 7
              # days on one issue, which trains maintainers to ignore the
              # channel (fork issue #502's own failure mode, from the other
              # side). The issue being open is already the signal; only the
              # "most recent still-red" evidence in the body needs updating.
              if ! CURRENT_BODY=$(gh issue view "$EXISTING" --repo "$REPO" --json body --jq '.body'); then
                echo "::error::could not read body of issue #$EXISTING — refusing to edit blind"
                exit 1
              fi

              # Exactly one marker is expected — it is written once by the
              # `gh issue create` above and never duplicated by this branch.
              # Zero means it was stripped or the issue predates the marker;
              # more than one means a previous run already went wrong. Either
              # way, editing blind risks corrupting the body further — fail
              # loudly instead (matches A4's discipline for this job).
              MARKER_COUNT=$(printf '%s' "$CURRENT_BODY" | grep -Fc "$STILL_RED_MARKER")
              if [ "$MARKER_COUNT" -ne 1 ]; then
                echo "::error::issue #$EXISTING body has $MARKER_COUNT occurrence(s) of the still-red marker (expected exactly 1) — refusing to edit a malformed body"
                exit 1
              fi

              # Replace ONLY the marker line and the one evidence line after
              # it, in place — never a to-end-of-body deletion. Any content a
              # maintainer added below the evidence line (notes, discussion)
              # must survive this update untouched. Built via `printf` into a
              # variable, not as a literal multi-line `sed` script embedded
              # in this YAML block: an embedded literal newline here is at
              # the mercy of the block scalar's indentation stripping, which
              # previously left stray leading spaces inside the replacement
              # text and corrupted the marker/evidence lines themselves.
              SED_SCRIPT=$(printf '\\|%s|,+1c\\\n%s\\\n%s' \
                "$STILL_RED_MARKER" "$STILL_RED_MARKER" "Most recent still-red run: $RUN_URL")
              if ! NEW_BODY=$(printf '%s' "$CURRENT_BODY" | sed -e "$SED_SCRIPT"); then
                echo "::error::sed failed updating the still-red evidence in issue #$EXISTING — refusing to edit blind"
                exit 1
              fi
              gh issue edit "$EXISTING" --repo "$REPO" --body "$NEW_BODY"
            fi
          elif [ "$RESULT" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$REPO" --comment "Recovered — drift-check passed: $RUN_URL" --reason completed
            fi
          fi
          # cancelled/skipped: do nothing either direction — not a real signal.
