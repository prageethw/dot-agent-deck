name: Docs Publish

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'GHCR image tag to publish (e.g. v0.26.0). Required when called by another workflow.'
        required: true
        type: string
      chart_version:
        description: 'If set, also update Chart.yaml version/appVersion (release path only).'
        required: false
        type: string
        default: ''
      push_latest:
        description: 'Also push :latest tag (release path only).'
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  # FORK-ONLY NOTE (fork issue #71) — DELIBERATELY UNGUARDED. This workflow is
  # upstream-only in effect: the image tags below are hardcoded to
  # `ghcr.io/vfarcic/dot-agent-deck-docs`, and the login uses the caller's
  # `GITHUB_TOKEN`, so on `prageethw/dot-agent-deck` the push is a 403.
  #
  # The `github.repository == 'vfarcic/dot-agent-deck'` guard for that lives on
  # the CALLER — the `docs` job in `release.yml` — and must NOT be duplicated
  # here. `workflow_dispatch` makes this workflow directly invocable, and the
  # `publish-docs` skill uses exactly that path; guarding the job here would
  # make a human-requested publish report success while doing nothing. A
  # standalone run on the fork is meant to fail loudly on the 403, which names
  # the actual problem (no write access to upstream's GHCR namespace).
  #
  # If the fork ever wants its own docs image, the fix is to repoint the tags
  # and the Helm values at `prageethw/…` — not to add a guard here.
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          # This job pushes the chart bump straight to `main` (see the "Commit
          # chart changes" step). Once `main` is protected, the default
          # GITHUB_TOKEN is rejected with `GH006: Protected branch update
          # failed`, which breaks both the release flow and a standalone
          # /publish-docs run — see CLAUDE.md rule 8. RELEASE_TOKEN is an admin
          # PAT that bypasses the ruleset. The `|| github.token` fallback keeps
          # this workflow behaving exactly as it does today while the secret is
          # unset, so this change is safe to merge before `main` is protected.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
            ORIGIN="workflow_call"
          else
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            TAG="main-${SHORT_SHA}"
            ORIGIN="manual"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "origin=${ORIGIN}" >> "$GITHUB_OUTPUT"

      - name: Compose tag list
        id: tags
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/vfarcic/dot-agent-deck-docs:${IMAGE_TAG}"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "ghcr.io/vfarcic/dot-agent-deck-docs:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docs image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: site/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm values
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG)' site/helm/values.yaml

      - name: Update Chart.yaml (release path only)
        if: inputs.chart_version != ''
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          yq -i '.version = strenv(CHART_VERSION)' site/helm/Chart.yaml
          yq -i '.appVersion = "v" + strenv(CHART_VERSION)' site/helm/Chart.yaml

      - name: Commit chart changes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ORIGIN: ${{ steps.tag.outputs.origin }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Sync local main to remote before re-applying our changes so the
          # push at the end fast-forwards cleanly even if main advanced
          # between checkout and this step (e.g. the release workflow's
          # changelog commit pushed in the finalize job).
          git stash --include-untracked || true
          git checkout main
          git pull --rebase --autostash origin main
          git stash pop || true
          git add site/helm/Chart.yaml site/helm/values.yaml
          if git diff --cached --quiet; then
            echo "No chart changes to commit"
            exit 0
          fi
          if [ "${ORIGIN}" = "manual" ]; then
            MSG="chore: publish docs image ${TAG} [skip ci]"
          else
            MSG="chore: update docs chart to ${TAG} [skip ci]"
          fi
          git commit -m "$MSG"
          git push origin main

      - name: Summary
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
          ORIGIN: ${{ steps.tag.outputs.origin }}
        run: |
          {
            echo "## Docs publish"
            echo ""
            echo "- **Image**: \`ghcr.io/vfarcic/dot-agent-deck-docs:${IMAGE_TAG}\`"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "- **Also tagged**: \`:latest\`"
            fi
            echo "- **Trigger**: ${ORIGIN}"
          } >> "$GITHUB_STEP_SUMMARY"
