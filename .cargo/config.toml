[alias]
# `--workspace` (issue #489, duplicate #470): the workspace root is itself a
# package and there is no `default-members`, so cargo's default target
# selection is the root package ALONE. Without this flag every test in
# `xtask/linkage-check` and `xtask/docs` executed in NO gate anywhere —
# neither alias below, nor CI, which runs the same commands. Measured:
# `cargo nextest run` = 1657 tests, `--workspace` = 1705.
#
# The sibling of #436, which added `--workspace` to clippy for the same
# reason. Clippy's half kept the COMPILE-time guarantees alive (those tests
# are built, so a type error or lint still fails), which is precisely why the
# gap was easy to miss: only the runtime assertions were inert.
#
# Free warm: the 48 added tests run in ~0.07s wall and every one is under
# 40ms, so they vanish into the existing parallelism. Measured back to back,
# the full tier is 26.4-26.9s root-only and 25.3-26.7s with `--workspace` —
# indistinguishable, because the tier's wall clock is set by its slowest test
# (~20s), not by its count.
test-fast = "nextest run --workspace"
# Issue #494: `--features e2e` names the CARGO FEATURE `e2e`, NOT a nextest
# profile. There is no `-P` / `--profile` here, so this — like `test-fast`
# above, and like every `cargo nextest run` in `.github/workflows/` — runs
# under nextest's `default` profile, the only profile `.config/nextest.toml`
# declares. Timeout carve-outs therefore belong under
# `[[profile.default.overrides]]`.
test-e2e = "nextest run --workspace --features e2e"
# Issue #502 lane 2. NOTE THE SHAPE: enabling BOTH features is a SUPERSET run
# — all 71 `tests/e2e_*.rs` files, i.e. the 47 deterministic ones `test-e2e`
# already runs PLUS the 24 credentialed ones. It is NOT a live-only run, and
# there is deliberately no alias that selects the live subset alone: the 24
# files open with `#![cfg(all(feature = "e2e", feature = "e2e-live"))]`, so
# `e2e-live` without `e2e` compiles every e2e file to an empty crate.
#
# So the three commands are: `test-fast` (fast tier, the per-task gate),
# `test-e2e` (lane 1 — needs no agent credentials, which is why CI runs it on
# every PR) and `test-e2e-live` (lane 1 + lane 2 — needs a working agent
# credential, and runs ONLY on a developer's machine; credential handling is
# issue #785). Lane 2 is deliberately not in CI: a credential in a public
# repository's CI is a vulnerability whose existence running it less often does
# not reduce, and the line the `e2e-live` feature draws is "reaches a real
# agent", not "reads a key" — on a developer box the agent CLIs are already
# authenticated, so a test that spawns `claude` spends a credential without
# ever touching an environment variable. CLAUDE.md rule 5 is the policy;
# `docs/develop/e2e-lanes.md` is the operational page.
#
# `--workspace` for the same reason as the two aliases above (issue #489):
# without it cargo selects the root package alone and every test in
# `xtask/linkage-check` and `xtask/docs` drops out of the gate.
test-e2e-live = "nextest run --workspace --features e2e,e2e-live"
# PRD #77 Decision 7: `cargo xtask linkage-check` enforces catalog↔test
# linkage. Args after the alias pass through to the binary.
xtask = "run --quiet --package xtask-linkage-check --"

[env]
# Issue #398: `build.rs` bakes this into `DAD_RELEASE_REPO`, which
# `src/version.rs` polls for the upgrade nudge's "latest release" feed.
# Upstream carries no `[env]` table at all, so `build.rs`'s own default
# (`vfarcic/dot-agent-deck`) is what an upstream build sees; this one line is
# the fork's entire divergence for issue #398 — no fork slug is baked into
# any source file (CLAUDE.md rule 19).
#
# `force = true`, unlike a bare string: cargo's `[env]` presence check tests
# whether the variable is already set in the process environment, not
# whether it is non-empty. With the default `force = false`, an exported
# `DAD_RELEASE_REPO=""` (e.g. a `docker run -e DAD_RELEASE_REPO` on a leg
# where the host value is unset) counts as "present" and discards this
# config value entirely — `build.rs` then sees the blank string, treats it
# as not injected, and silently falls back to `DEFAULT_RELEASE_REPO`
# (upstream), reviving the exact bug this line fixes. This value is a fork
# identity constant, not a per-build override a packager legitimately needs
# to vary from what this checkout's own config says, so `force = true` is
# safe: every build path that also injects `DAD_RELEASE_REPO` explicitly
# (`release.yml`, `flake.nix`) injects this same slug, so forcing the config
# value to win changes nothing for them and only closes the empty-string gap.
DAD_RELEASE_REPO = { value = "prageethw/dot-agent-deck", force = true }
