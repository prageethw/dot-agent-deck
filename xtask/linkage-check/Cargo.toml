[package]
name = "xtask-linkage-check"
version = "0.0.0"
edition = "2024"
publish = false

# PRD #77 Decision 7: enforces the catalog↔test linkage and Decision 21's
# no-raw-sleep rule. Invoked as `cargo xtask linkage-check` via the
# alias defined in `.cargo/config.toml`.

[[bin]]
name = "xtask-linkage-check"
path = "src/main.rs"

[dependencies]
proc-macro2 = "1"
regex = "1"
syn = { version = "3", features = ["full", "parsing"] }
xtask-docs = { path = "../docs" }
# PRD fork#340 M3: `work-type-check --self-test` builds a scratch git repo at
# runtime (production code, not `#[cfg(test)]`) to prove the gate genuinely
# rejects a violating case — `tempfile` therefore has to be a real dependency
# here, not only a dev one. Already a workspace dependency at the same "3"
# version (root `Cargo.toml`), so this pulls no new crate into Cargo.lock.
tempfile = "3"

# `clean-e2e-tmp` needs two libc calls that have no std equivalent:
#
# - `geteuid(2)` (issue #322) scopes the harness's private `/var/tmp` parent to
#   the effective UID, and proves that parent is really this user's before
#   anything under it is deleted.
# - `kill(pid, 0)` (issue #461) decides ownership by liveness — the only call
#   that distinguishes "no such process" (ESRCH, dead) from "not yours" (EPERM,
#   alive).
#
# `libc` is already a workspace dependency at the same version and gating (the
# root package declares it under `[target.'cfg(unix)'.dependencies]`), so this
# pulls no new crate into Cargo.lock. Unix-only: every `libc::` reference is
# behind `#[cfg(unix)]`, the whole `/var/tmp` rung is `cfg(unix)`-gated to match
# the harness, and non-Unix targets fall back to the age rule.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
