# SonarQube Cloud (free plan) project configuration. See docs/develop/sonarqube.md
# for why this is Cloud rather than Community Build, the SONAR_TOKEN secret it
# needs, and where to correct the keys below if analysis fails with "Project not
# found" or "You're not authorized to run analysis".
#
# sonar.organization / sonar.projectKey are SonarCloud's conventional defaults for
# a GitHub import (lowercased org login; org_repo for the key) and have NOT been
# confirmed against the actual SonarCloud project settings page. If CI fails on
# either, check https://sonarcloud.io for the real values and update here.
sonar.organization=prageethw
sonar.projectKey=prageethw_dot-agent-deck

sonar.sources=.
sonar.exclusions=target/**,tests/snapshots/**,site/build/**,site/node_modules/**,.dot-agent-deck/**

# Imports the clippy run from CI instead of Sonar re-linting the workspace itself.
sonar.rust.clippyReport.reportPaths=clippy-report.json
